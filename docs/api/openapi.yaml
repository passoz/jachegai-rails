              "$ref": "#/components/schemas/CustomerFavoriteCreateRequest"
      responses:
        '201':
          description: Favorite added
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Envelope"
        '400':
          "$ref": "#/components/responses/InvalidInput"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '422':
          "$ref": "#/components/responses/ValidationError"
  "/api/v1/customer/favorites/{id}":
    delete:
      summary: Remove favorite seller
      operationId: customerFavoritesDestroy
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: The seller ID
        schema:
          type: string
      responses:
        '200':
          description: Favorite removed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Envelope"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
  "/api/v1/customer/cart":
    get:
      summary: Get customer cart
      operationId: customerCartShow
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Customer cart content with server-authoritative price preview. Delivery fee is zero until checkout fee policy is introduced.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CustomerCartEnvelope"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
    delete:
      summary: Clear customer cart
      operationId: customerCartDestroy
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Empty cart
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CustomerCartEnvelope"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
  "/api/v1/customer/cart/items":
    post:
      summary: Add item to customer cart
      operationId: customerCartItemsCreate
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CustomerCartItemCreateRequest"
      responses:
        '201':
          description: Item added
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CustomerCartEnvelope"
        '400':
          "$ref": "#/components/responses/InvalidInput"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '422':
          "$ref": "#/components/responses/ValidationError"
        '413':
          "$ref": "#/components/responses/PayloadTooLarge"
  "/api/v1/customer/cart/items/{id}":
    patch:
      summary: Update cart item quantity
      operationId: customerCartItemsUpdate
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CustomerCartItemUpdateRequest"
      responses:
        '200':
          description: Item updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CustomerCartEnvelope"
        '400':
          "$ref": "#/components/responses/InvalidInput"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/ValidationError"
        '413':
          "$ref": "#/components/responses/PayloadTooLarge"
    delete:
      summary: Remove item from customer cart
      operationId: customerCartItemsDestroy
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Item removed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CustomerCartEnvelope"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
  "/api/v1/customer/cart/handoff":
    post:
      summary: Transfer guest cart to customer cart
      operationId: customerCartHandoff
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CustomerCartHandoffRequest"
      responses:
        '200':
          description: Cart merged
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CustomerCartEnvelope"
        '400':
          "$ref": "#/components/responses/InvalidInput"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          "$ref": "#/components/responses/Conflict"
        '422':
          "$ref": "#/components/responses/ValidationError"
        '413':
          "$ref": "#/components/responses/PayloadTooLarge"
  "/api/v1/customer/checkout":
    post:
      summary: Confirm customer checkout atomically
      description: Uses authoritative catalog prices and decrements inventory atomically. Replays with the same key and payload return the original order.
      operationId: customerCheckoutCreate
      security:
      - BearerAuth: []
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CustomerCheckoutRequest"
      responses:
        '201':
          description: Order, item/address snapshots, pending payment, inventory movement and outbox event committed atomically
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CustomerCheckoutEnvelope"
        '400':
          "$ref": "#/components/responses/InvalidInput"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '413':
          "$ref": "#/components/responses/PayloadTooLarge"
        '422':
          "$ref": "#/components/responses/ValidationError"
        '429':
          "$ref": "#/components/responses/TooManyRequests"
        '503':
          "$ref": "#/components/responses/ServiceUnavailable"
  "/api/v1/customer/orders/{id}/cancel":
    post:
      summary: Cancel a pending order (customer)
      operationId: customerOrdersCancel
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - reason
              properties:
                reason:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Order cancelled
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OrderCancellationEnvelope"
        '400':
          "$ref": "#/components/responses/InvalidInput"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '413':
          "$ref": "#/components/responses/PayloadTooLarge"
        '422':
          "$ref": "#/components/responses/ValidationError"
components:
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Opaque key scoped to the authenticated principal and application operation.
      schema:
        type: string
        minLength: 1
        maxLength: 128
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      - full_name
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        full_name:
          type: string
          minLength: 1
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    User:
      type: object
      required:
      - id
      - email
      - full_name
      - roles
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        roles:
          type: array
          items:
            type: string
        active:
          type: boolean
    AuthData:
      type: object
      required:
      - token
      - user
      properties:
        token:
          type: string
        user:
          "$ref": "#/components/schemas/User"
    Seller:
      type: object
      required:
      - id
      - name
      - slug
      - moderation_state
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        contact_email:
          type: string
          format: email
        contact_phone:
          type: string
        address_line1:
          type: string
        address_city:
          type: string
        address_state:
          type: string
        address_zip:
          type: string
        address_country:
          type: string
        moderation_state:
          type: string
          enum:
          - pending_review
          - approved
          - suspended
          - rejected
        moderated_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    SellerSettings:
      type: object
      required:
      - id
      - seller_id
      - currency
      - auto_accept_orders
      - preparation_time_minutes
      properties:
        id:
          type: string
          format: uuid
        seller_id:
          type: string
          format: uuid
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        auto_accept_orders:
          type: boolean
        preparation_time_minutes:
          type: integer
          minimum: 0
    Category:
      type: object
      required:
      - id
      - seller_id
      - name
      - position
      properties:
        id:
          type: string
          format: uuid
        seller_id:
          type: string
          format: uuid
        name:
          type: string
        position:
          type: integer
          minimum: 0
    Product:
      type: object
      required:
      - id
      - seller_id
      - name
      - price_cents
      - currency
      - active
      properties:
        id:
          type: string
          format: uuid
        seller_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        price_cents:
          type: integer
          minimum: 0
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
    InventoryItem:
      type: object
      required:
      - id
      - seller_id
      - product_id
      - quantity
      properties:
        id:
          type: string
          format: uuid
        seller_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        product_name:
          type: string
        quantity:
          type: integer
          minimum: 0
    OnboardingRequest:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        contact_email:
          type: string
          format: email
        contact_phone:
          type: string
        address_line1:
          type: string
        address_city:
          type: string
        address_state:
          type: string
        address_zip:
          type: string
        address_country:
          type: string
    ProfileUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        description:
          type: string
        contact_email:
          type: string
          format: email
        contact_phone:
          type: string
        address_line1:
          type: string
        address_city:
          type: string
        address_state:
          type: string
        address_zip:
          type: string
        address_country:
          type: string
    SettingsUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        auto_accept_orders:
          type: boolean
        preparation_time_minutes:
          type: integer
          minimum: 0
    CategoryCreateRequest:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
        position:
          type: integer
          minimum: 0
    CategoryUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        position:
          type: integer
          minimum: 0
    ReorderRequest:
      type: object
      additionalProperties: false
      required:
      - ordered_ids
      properties:
        ordered_ids:
          type: array
          items:
            type: string
    ProductCreateRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - price_cents
      - currency
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        price_cents:
          type: integer
          minimum: 0
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        category_id:
          type:
          - string
          - 'null'
          format: uuid
    ProductUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        description:
          type:
          - string
          - 'null'
        price_cents:
          type: integer
          minimum: 0
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        category_id:
          type:
          - string
          - 'null'
          format: uuid
    InventoryRequest:
      type: object
      additionalProperties: false
      required:
      - quantity
      properties:
        quantity:
          type: integer
          minimum: 0
    ModerationRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
    SellerEnvelope:
      allOf:
      - "$ref": "#/components/schemas/Envelope"
      - type: object
        properties:
          data:
            "$ref": "#/components/schemas/Seller"
    AdminSellerEnvelope:
      allOf:
      - "$ref": "#/components/schemas/Envelope"
      - type: object
        properties:
          data:
            "$ref": "#/components/schemas/Seller"
    AdminSellerListEnvelope:
      allOf:
      - "$ref": "#/components/schemas/Envelope"
      - type: object
        properties:
          data:
            type: object
            required:
            - sellers
            properties:
              sellers:
                type: array
                items:
                  "$ref": "#/components/schemas/Seller"
          meta:
            "$ref": "#/components/schemas/PaginationMeta"
    SettingsEnvelope:
      allOf:
      - "$ref": "#/components/schemas/Envelope"
      - type: object
        properties:
          data:
            "$ref": "#/components/schemas/SellerSettings"
    CategoryEnvelope:
      allOf:
      - "$ref": "#/components/schemas/Envelope"
      - type: object
        properties:
          data:
            "$ref": "#/components/schemas/Category"
    CategoryListEnvelope:
      allOf:
      - "$ref": "#/components/schemas/Envelope"
      - type: object
        properties:
          data:
            type: object
            required:
            - categories
            properties:
              categories:
                type: array
                items:
                  "$ref": "#/components/schemas/Category"
          meta:
            "$ref": "#/components/schemas/PaginationMeta"
    ProductEnvelope:
      allOf:
      - "$ref": "#/components/schemas/Envelope"
      - type: object
        properties:
          data:
            "$ref": "#/components/schemas/Product"
    ProductListEnvelope:
      allOf:
      - "$ref": "#/components/schemas/Envelope"
      - type: object
        properties:
          data:
            type: object
            required:
            - products
            properties:
              products:
                type: array
                items:
                  "$ref": "#/components/schemas/Product"
          meta:
            "$ref": "#/components/schemas/PaginationMeta"
    InventoryEnvelope:
      allOf:
      - "$ref": "#/components/schemas/Envelope"
      - type: object
        properties:
          data:
            "$ref": "#/components/schemas/InventoryItem"
    InventoryListEnvelope:
      allOf:
      - "$ref": "#/components/schemas/Envelope"
      - type: object
        properties:
          data:
            type: object
            required:
            - inventory
            properties:
              inventory:
                type: array
                items:
                  "$ref": "#/components/schemas/InventoryItem"
          meta:
            "$ref": "#/components/schemas/PaginationMeta"
    PaginationMeta:
      type: object
      required:
      - count
      - page
      - per_page
      - total
      - total_pages
      properties:
        count:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
    Envelope:
      type: object
      required:
      - ok
      - data
      - meta
      properties:
        ok:
          type: boolean
          enum:
          - true
        data:
          type: object
        meta:
          type: object
    AuthEnvelope:
      allOf:
      - "$ref": "#/components/schemas/Envelope"
      - type: object
        properties:
          data:
            "$ref": "#/components/schemas/AuthData"
    UserEnvelope:
      allOf:
      - "$ref": "#/components/schemas/Envelope"
      - type: object
        properties:
          data:
            "$ref": "#/components/schemas/User"
    CourierOnboardingRequest:
      type: object
      additionalProperties: false
      required: [phone, document_number, vehicle_type]
      properties:
        phone:
          type: string
        document_number:
          type: string
        vehicle_type:
          type: string
          enum: [motorcycle, bicycle, car, foot]
        vehicle_plate:
          type: [string, 'null']
        location_consent:
          type: boolean
    CourierProfileUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        phone:
          type: [string, 'null']
        vehicle_type:
          type: [string, 'null']
          enum: [motorcycle, bicycle, car, foot, null]
        vehicle_plate:
          type: [string, 'null']
        location_consent:
          type: boolean
    CourierAvailabilityRequest:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          type: string
          enum: [available, offline]
    OptionalReasonRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: [string, 'null']
    Courier:
      type: object
      additionalProperties: false
      required: [id, user_id, phone, document_number, vehicle_type, moderation_state, operational_state, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        phone:
          type: string
        document_number:
          type: string
        vehicle_type:
          type: string
          enum: [motorcycle, bicycle, car, foot]
        vehicle_plate:
          type: [string, 'null']
        moderation_state:
          type: string
          enum: [pending_review, approved, suspended, rejected]
        operational_state:
          type: string
          enum: [offline, available, on_delivery]
        location_consent_given_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CourierEnvelope:
      type: object
      additionalProperties: false
      required: [ok, data, meta]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          "$ref": "#/components/schemas/Courier"
        meta:
          type: object
    AdminCourierCollectionEnvelope:
      type: object
      additionalProperties: false
      required: [ok, data, meta]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          additionalProperties: false
          required: [couriers]
          properties:
            couriers:
              type: array
              items:
                "$ref": "#/components/schemas/Courier"
        meta:
          "$ref": "#/components/schemas/PaginationMeta"
    CourierEligibleOrder:
      type: object
      additionalProperties: false
      required: [id, seller_id, order_state, currency, courier_fee_cents, created_at]
      properties:
        id:
          type: string
          format: uuid
        seller_id:
          type: string
          format: uuid
        order_state:
          type: string
          enum: [ready]
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        courier_fee_cents:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
    CourierEligibleOrderCollectionEnvelope:
      type: object
      additionalProperties: false
      required: [ok, data, meta]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: array
          items:
            "$ref": "#/components/schemas/CourierEligibleOrder"
        meta:
          "$ref": "#/components/schemas/PaginationMeta"
    CourierOrder:
      type: object
      additionalProperties: false
      required: [id, customer_id, seller_id, courier_id, order_state, payment_state, currency, subtotal_cents, delivery_fee_cents, discount_cents, courier_fee_cents, total_cents, items, delivery_address, created_at]
      properties:
        id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        seller_id:
          type: string
          format: uuid
        courier_id:
          type: [string, 'null']
          format: uuid
        order_state:
          "$ref": "#/components/schemas/OrderState"
        payment_state:
          type: [string, 'null']
          enum: [pending, paid, failed, refunded, null]
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        subtotal_cents:
          type: integer
          minimum: 0
        delivery_fee_cents:
          type: integer
          minimum: 0
        discount_cents:
          type: integer
          minimum: 0
        courier_fee_cents:
          type: integer
          minimum: 0
        total_cents:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            "$ref": "#/components/schemas/OrderItemSnapshot"
        delivery_address:
          "$ref": "#/components/schemas/DeliveryAddressSnapshot"
        created_at:
          type: string
          format: date-time
    CourierOrderEnvelope:
      type: object
      additionalProperties: false
      required: [ok, data, meta]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          "$ref": "#/components/schemas/CourierOrder"
        meta:
          type: object
    CourierActiveOrderEnvelope:
      type: object
      additionalProperties: false
      required: [ok, data, meta]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          anyOf:
          - "$ref": "#/components/schemas/CourierOrder"
          - type: 'null'
        meta:
          type: object
    CourierOrderCollectionEnvelope:
      type: object
      additionalProperties: false
