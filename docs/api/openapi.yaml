      summary: Read the current seller's profile
      operationId: sellerProfileShow
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Seller profile
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SellerEnvelope"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
    patch:
      summary: Update the current seller's profile
      operationId: sellerProfileUpdate
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ProfileUpdateRequest"
      responses:
        '200':
          description: Updated seller profile
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SellerEnvelope"
        '400':
          "$ref": "#/components/responses/InvalidInput"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '413':
          "$ref": "#/components/responses/PayloadTooLarge"
        '422':
