openapi: 3.1.0
info:
  title: JaChegai API
  version: 1.0.0
  description: |
    Backend MVP REST API. Frontend/UI is out of scope for this version.

    ## Versioning and compatibility policy

    - All endpoints are versioned under the `/api/v1/` prefix. Breaking changes
      are introduced only in a new major version (`/api/v2/`); the previous
      version remains available for a deprecation window of at least 90 days.
    - Additive changes (new optional fields, new endpoints, new error codes)
      are allowed within a version and are backwards compatible.
    - Removing or renaming fields, changing their meaning, changing required
      fields, changing status codes or altering envelope shape are breaking
      changes and require a new major version.
    - The response envelope is stable: `{ ok: true, data, meta }` on success
      and `{ ok: false, error: { code, message, context } }` on failure.
    - All resource IDs are UUID v7 generated by the server. Clients must treat
      IDs as opaque strings and never generate them.
    - Health checks (`/healthz`, `/readyz`) live outside the API namespace and
      are not part of the versioned contract.
    - Errors never disclose other tenants' resources: cross-resource access
      returns `not_found` rather than `forbidden` when existence must be hidden.
servers:
- url: http://localhost:3000
  description: Local development
paths:
  "/healthz":
    get:
      summary: Liveness check
      operationId: liveness
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Envelope"
  "/readyz":
    get:
      summary: Readiness check
      operationId: readiness
      responses:
        '200':
          description: Dependencies are ready
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Envelope"
        '503':
          description: A mandatory dependency is unavailable
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/v1/auth/register":
    post:
      summary: Register a customer account
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RegisterRequest"
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthEnvelope"
        '400':
          "$ref": "#/components/responses/InvalidInput"
        '413':
          "$ref": "#/components/responses/PayloadTooLarge"
        '422':
          "$ref": "#/components/responses/ValidationError"
  "/api/v1/auth/login":
    post:
      summary: Authenticate and issue a bearer token
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LoginRequest"
      responses:
        '200':
          description: Authentication succeeded
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthEnvelope"
        '400':
          "$ref": "#/components/responses/InvalidInput"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '413':
          "$ref": "#/components/responses/PayloadTooLarge"
        '429':
          "$ref": "#/components/responses/RateLimited"
  "/api/v1/auth/me":
    get:
      summary: Return the authenticated principal
      operationId: me
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Current principal
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserEnvelope"
        '401':
          "$ref": "#/components/responses/Unauthorized"
