          type: string
      responses:
        '200':
          description: Product deleted
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Envelope"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
  "/api/v1/seller/products/{id}/activate":
