          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SettingsEnvelope"
        '400':
          "$ref": "#/components/responses/InvalidInput"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '404':
          "$ref": "#/components/responses/NotFound"
        '413':
          "$ref": "#/components/responses/PayloadTooLarge"
        '422':
